<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You | Pixelasia Productions Dili</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;1,500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { background: #fcfaf7; }
    .thankyou {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      text-align: center;
    }
    .thankyou__box { max-width: 480px; }
    .thankyou__icon {
      width: 72px; height: 72px;
      border-radius: 50%;
      background: rgba(107,63,160,0.1);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 24px;
    }
    .thankyou__title {
      font-family: 'Playfair Display', serif;
      font-size: 42px; font-weight: 500;
      color: #1a1128; margin-bottom: 16px;
    }
    .thankyou__sub {
      font-size: 16px; line-height: 1.7;
      color: rgba(26,17,40,0.65);
      margin-bottom: 36px;
    }
  </style>
</head>
<body>
  <main class="thankyou">
    <div class="thankyou__box">
      <div class="thankyou__icon" aria-hidden="true">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none">
          <path d="M8 12l3 3 5-5" stroke="#6B3FA0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="12" cy="12" r="9" stroke="#6B3FA0" stroke-width="1.5"/>
        </svg>
      </div>
      <h1 class="thankyou__title">Thank you!</h1>
      <p class="thankyou__sub">
        We received your message and will get back to you as soon as possible.<br>
        In the meantime, feel free to reach us via WhatsApp.
      </p>
      <a href="/" class="btn btn--primary">Back to Pixelasia</a>
    </div>
  </main>
</body>
</html>
